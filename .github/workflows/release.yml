name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binaries
        run: |
          mkdir -p dist
          # Build macOS Intel binary
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/setupper-darwin-amd64 ./cmd/setupper
          # Build macOS Apple Silicon binary
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/setupper-darwin-arm64 ./cmd/setupper
          
          # Package them
          tar -czvf dist/setupper-darwin-amd64.tar.gz -C dist setupper-darwin-amd64
          tar -czvf dist/setupper-darwin-arm64.tar.gz -C dist setupper-darwin-arm64

      - name: Generate Checksums
        run: |
          cd dist
          shasum -a 256 setupper-darwin-amd64.tar.gz setupper-darwin-arm64.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/setupper-darwin-amd64.tar.gz
            dist/setupper-darwin-arm64.tar.gz
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
